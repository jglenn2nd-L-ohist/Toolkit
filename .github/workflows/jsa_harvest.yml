name: JSA Daily Harvest

on:
  schedule:
    - cron: '0 13 * * 1-5'   # 9am EDT Mon-Fri (primary)
    - cron: '0 17 * * 1-5'   # 1pm EDT Mon-Fri (backup if primary skipped)
  workflow_dispatch:           # Manual trigger
  # Last refreshed: 2026-09-23

jobs:
  harvest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install google-auth google-auth-oauthlib google-auth-httplib2 google-api-python-client

      - name: Run JSA scraper
        env:
          GMAIL_TOKEN: ${{ secrets.GMAIL_TOKEN }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          JSA_GH_TOKEN: ${{ secrets.JSA_GITHUB_TOKEN }}
          # JSA_DATA_REPO: jglenn2nd-L-ohist/jsa-data   # uncomment after moving data private
        run: python jsa_scraper.py
