name: JSA Daily Harvest

on:
  schedule:
    # BACKUP ONLY. The laptop's daily task starts this harvest on demand (it begins within a
    # minute). This scheduled run skips itself if a harvest already ran in the last 10 hours.
    # GitHub runs schedules late under load, especially on the hour, so this uses minute 23.
    # Times are UTC: 18:23 UTC = 1:23 PM Eastern in winter, 2:23 PM in summer.
    - cron: '23 18 * * 1-5'
  workflow_dispatch:           # laptop task + app Run button

jobs:
  harvest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install google-auth google-auth-oauthlib google-auth-httplib2 google-api-python-client

      - name: Run JSA scraper
        env:
          GMAIL_TOKEN: ${{ secrets.GMAIL_TOKEN }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          JSA_GH_TOKEN: ${{ secrets.JSA_GITHUB_TOKEN }}
          # JSA_DATA_REPO: jglenn2nd-L-ohist/jsa-data   # uncomment after moving data private
        run: python jsa_scraper.py
